name: One-time Pferdezauber horse-leading preview
on:
  push:
    branches: [feature/pferdezauber-leading-outfits-landscape]
    paths: [.github/workflows/pferdezauber-leading-preview.yml]
permissions:
  contents: read
concurrency:
  group: allinkl-pferdezauber-leading-preview
  cancel-in-progress: false
jobs:
  isolated-leading-preview:
    if: >-
      github.repository == 'frankherchet/games-workshop' && github.ref == 'refs/heads/feature/pferdezauber-leading-outfits-landscape' && github.event.head_commit.message == 'chore: publish isolated horse-leading test page once'
    runs-on: ubuntu-latest
    environment: allinkl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test all existing games and build standalone browser page
        run: |
          node --test tests/*.test.js
          python3 -m unittest discover -s tests -p 'test_*.py'
          node scripts/build.js
          node scripts/check.js
      - name: Publish only the new demo directory, then verify via HTTPS SHA-256
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy_pferdezauber_leading_once.py
