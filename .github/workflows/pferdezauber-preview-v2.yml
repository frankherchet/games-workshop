name: One-time Pferdezauber v2 isolated preview
on:
  push:
    branches: [feature/pferdezauber-3d-prototyp]
    paths: [.github/workflows/pferdezauber-preview-v2.yml]
permissions:
  contents: read
concurrency:
  group: allinkl-pferdezauber-preview-v2
  cancel-in-progress: false
jobs:
  isolated-preview-v2:
    if: >-
      github.repository == 'frankherchet/games-workshop' && github.ref == 'refs/heads/feature/pferdezauber-3d-prototyp' && github.event.head_commit.message == 'chore: publish one-time isolated Pferdezauber v2 preview'
    runs-on: ubuntu-latest
    environment: allinkl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test and build the isolated preview
        run: |
          node --test tests/*.test.js
          python3 -m unittest discover -s tests -p 'test_*.py'
          node scripts/build.js
          node scripts/check.js
      - name: Upload only the new Pferdezauber v2 preview directory and verify HTTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy_pferdezauber_v2_once.py
