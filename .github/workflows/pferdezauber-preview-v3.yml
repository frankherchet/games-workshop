name: One-time Pferdezauber v3 isolated preview
on:
  push:
    branches: [feature/pferdezauber-human-speed-horse-control]
    paths: [.github/workflows/pferdezauber-preview-v3.yml]
permissions:
  contents: read
concurrency:
  group: allinkl-pferdezauber-preview-v3
  cancel-in-progress: false
jobs:
  preview-v3:
    if: >-
      github.repository == 'frankherchet/games-workshop' && github.ref == 'refs/heads/feature/pferdezauber-human-speed-horse-control' && github.event.head_commit.message == 'chore: publish one-time isolated Pferdezauber v3 preview'
    runs-on: ubuntu-latest
    environment: allinkl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test and build isolated preview
        run: |
          node --test tests/*.test.js
          python3 -m unittest discover -s tests -p 'test_*.py'
          node scripts/build.js
          node scripts/check.js
      - name: Publish in new folder and verify HTTPS SHA256
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy_pferdezauber_v3_once.py
