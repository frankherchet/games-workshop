name: One-time Pferdezauber riding preview
on:
  push:
    branches: [feature/pferdezauber-riding-saddle-bridle]
    paths: [.github/workflows/pferdezauber-riding-preview.yml]
permissions:
  contents: read
concurrency:
  group: allinkl-pferdezauber-riding-preview
  cancel-in-progress: false
jobs:
  isolated-riding-preview:
    if: >-
      github.repository == 'frankherchet/games-workshop' && github.ref == 'refs/heads/feature/pferdezauber-riding-saddle-bridle' && github.event.head_commit.message == 'chore: publish one-time isolated riding preview'
    runs-on: ubuntu-latest
    environment: allinkl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and test all games
        run: |
          node --test tests/*.test.js
          python3 -m unittest discover -s tests -p 'test_*.py'
          node scripts/build.js
          node scripts/check.js
      - name: Publish only to fresh preview folder, verify HTTPS checksum
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy_pferdezauber_riding_once.py
